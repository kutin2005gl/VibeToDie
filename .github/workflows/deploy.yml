# Deploy the backend stack to one EC2 host on every push to main or develop (or by hand from the Actions tab).
# The source is copied over SSH and built on the host with Docker Compose; .env stays on the host only.
# Secrets: EC2_HOST (public IP or DNS), EC2_USER (ubuntu), EC2_SSH_KEY (contents of the .pem key).
name: deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Go tests
        run: |
          for svc in gateway user-service order-service slack; do
            echo "::group::$svc"
            (cd "$svc" && go test ./...)
            echo "::endgroup::"
          done
      - name: Compose file is valid
        run: JWT_SECRET=ci-only-placeholder-secret-0123456789 docker compose config -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy source to the host
        run: |
          rsync -az --delete \
            --exclude .git --exclude .github --exclude frontend \
            --exclude node_modules --exclude .env --exclude '.env.*' \
            -e "ssh -i ~/.ssh/ec2.pem" \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/app/"

      - name: Build and restart the stack
        run: |
          ssh -i ~/.ssh/ec2.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            set -e
            cd ~/app
            test -f .env || { echo "~/app/.env is missing on the host"; exit 1; }
            docker compose up -d --build --remove-orphans
            docker image prune -f
            docker compose ps
          '

      - name: Gateway answers
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://${{ secrets.EC2_HOST }}:8080/api/users/me" || true)
            # 401 means the gateway is up and checked auth
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then echo "gateway HTTP $code"; exit 0; fi
            sleep 5
          done
          echo "gateway did not answer"; exit 1
