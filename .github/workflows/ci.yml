# Tests on every PR and on pushes to other branches. main and develop run it through deploy.yml.
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main, develop]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Go tests
        run: |
          for svc in gateway user-service order-service slack; do
            echo "::group::$svc"
            (cd "$svc" && go test ./...)
            echo "::endgroup::"
          done
      - name: Compose file is valid
        run: JWT_SECRET=ci-only-placeholder-secret-0123456789 docker compose config -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
